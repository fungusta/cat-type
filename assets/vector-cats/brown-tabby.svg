<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <title>Leo — editable idle pose</title>
  <desc>Editable brown mackerel tabby (Leo) with a continuous head, ear and body outline: forehead "M", cream eye rings, dark eye lines, cheek swirls and a brick-pink nose. Inner-ear fills, face, paws and toe beans are separate editable parts.</desc>
