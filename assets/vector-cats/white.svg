        <path id="ear-inner-right" fill="#f59aac" d="M95.1855 34.1096 C94.3219 30.1765 94.0607 25.8638 92.1026 22.0546 C91.9563 21.77 91.3599 21.2833 91.2051 21.3457 C89.1339 22.1813 85.0484 25.9678 82.0422 28.4678 C81.8176 28.6545 81.8368 29.0773 82.0789 29.1239 C85.3193 29.747 90.5735 31.5919 94.5271 34.3509 C94.8225 34.557 95.25 34.4035 95.1855 34.1096 Z" />
      </g>
    </g>
    <g id="head">
