<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Cat Type advert</title>
  <link rel="stylesheet" href="advert.css">
</head>
<body>
  <div id="root" data-composition-id="advert" data-start="0" data-duration="27" data-width="1920" data-height="1080">
    <div id="scene-stage" class="clip" data-start="0" data-duration="27" data-track-index="0">
      <div id="camera">
        <div id="cat-spot">
          <div id="cat-rig"></div>
        </div>
        <div id="typed-line">
          <span id="typed-ghost" aria-hidden="true"></span>
          <span id="typed-live"><span id="typed"></span><span id="caret"></span></span>
        </div>
      </div>
      <div id="unlock-ui">
        <div id="counter-block">
          <p id="counter">0</p>
          <p id="counter-label">keystrokes</p>
        </div>
        <ul id="tiles"></ul>
      </div>
      <div id="track-ui">
        <div id="track-card">
          <dl id="stats">
            <div class="stat"><dt>Today</dt><dd data-stat="today">0</dd></div>
            <div class="stat"><dt>Last 7 days</dt><dd data-stat="last7">0</dd></div>
            <div class="stat"><dt>All time</dt><dd data-stat="allTime">0</dd></div>
          </dl>
          <div id="chart"></div>
        </div>
      </div>
      <div id="end-card">
        <span id="heart" aria-hidden="true">♥</span>
        <h1 id="end-title"></h1>
        <p id="end-line"></p>
        <p id="end-url"></p>
      </div>
    </div>
    <section class="clip card" id="card-customise" data-start="7" data-duration="1" data-track-index="1"><p class="card-text"></p></section>
    <section class="clip card" id="card-unlock" data-start="13" data-duration="1" data-track-index="1"><p class="card-text"></p></section>
    <section class="clip card" id="card-track" data-start="18" data-duration="1" data-track-index="1"><p class="card-text"></p></section>
    <audio id="soundtrack" src="sfx/soundtrack.wav" data-start="0" data-duration="27" data-track-index="9" data-volume="1"></audio>
  </div>
  <script src="js/gsap.min.js"></script>
  <script src="js/advert.js"></script>
</body>
</html>
