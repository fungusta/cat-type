name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: Cat-Type-Windows-x64.exe
            source: dist/Cat-Type-Windows-x64.exe
            executable: dist/Cat Type.exe
            package_arch: x64
          - runner: macos-15-intel
            asset: Cat-Type-macOS-x64.dmg
            source: dist/Cat-Type-macOS-x64.dmg
            executable: dist/Cat Type.app/Contents/MacOS/Cat Type
            package_arch: x64
          - runner: macos-15
            asset: Cat-Type-macOS-arm64.dmg
            source: dist/Cat-Type-macOS-arm64.dmg
            executable: dist/Cat Type.app/Contents/MacOS/Cat Type
            package_arch: arm64
          - runner: ubuntu-22.04
            asset: Cat-Type-Linux-x64.tar.gz
            source: dist/Cat-Type-Linux-x64.tar.gz
            executable: dist/Cat Type
            package_arch: x64
          - runner: ubuntu-22.04-arm
            asset: Cat-Type-Linux-arm64.tar.gz
            source: dist/Cat-Type-Linux-arm64.tar.gz
            executable: dist/Cat Type
            package_arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_version.py "${{ github.ref_name }}"

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk libayatana-appindicator3-1 xauth xvfb

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Run automated tests
        if: runner.os != 'Linux'
        run: >-
          python -m unittest
          tests.test_macos_overlay_focus
          tests.test_behavior
          tests.test_settings
          tests.test_usage_metrics
          tests.test_settings_window
          tests.test_platform_assets
          tests.test_bundled_icon_check
          tests.test_package_smoke
          tests.test_release_version_check
          tests.test_auto_update
          tests.test_update_controller
          tests.test_platform_updater
          tests.test_windows_installer_contract
          -v

      - name: Run automated tests with a virtual display
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          python -m unittest
          tests.test_macos_overlay_focus
          tests.test_behavior
          tests.test_settings
          tests.test_usage_metrics
          tests.test_settings_window
          tests.test_platform_assets
          tests.test_bundled_icon_check
          tests.test_package_smoke
          tests.test_release_version_check
          tests.test_auto_update
          tests.test_update_controller
          tests.test_platform_updater
          tests.test_windows_installer_contract
          tests.test_linux_update_integration
          -v

      - name: Build application
        run: |
          python scripts/build_icon.py
          python -m PyInstaller --noconfirm --clean CatType.spec

      - name: Verify bundled runtime assets
        run: python -m scripts.check_bundled_icon "${{ matrix.executable }}"

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          python -m scripts.smoke_linux_package
          "${{ matrix.executable }}"

      - name: Smoke test frozen Linux update
        if: runner.os == 'Linux'
        run: >-
          python -m scripts.smoke_linux_update
          "${{ matrix.executable }}"

      - name: Smoke test Windows shutdown handoff
        if: runner.os == 'Windows'
        run: >-
          python -m scripts.smoke_windows_package
          "${{ matrix.executable }}"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\CatType.iss
          Move-Item -LiteralPath "dist\Cat Type Setup.exe" -Destination "dist\Cat-Type-Windows-x64.exe"

      - name: Build isolated Windows installer smoke fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $legacyRoot = Join-Path $env:RUNNER_TEMP "cat-type-v1.0.5"
          git worktree add --detach $legacyRoot b0ce667
          Push-Location $legacyRoot
          try {
            python -m PyInstaller --noconfirm --clean CatType.spec
          }
          finally {
            Pop-Location
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppId={{15AA574B-A234-42C7-8328-607B2D83000F}" `
            "/DMyOutputBaseFilename=Cat Type Smoke Setup" `
            "/DMyUninstallable=no" `
            "/DSmokeTest=1" `
            packaging\CatType.iss

      - name: Smoke test Windows legacy installer update
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/smoke_windows_installer_update.ps1
          -Installer "dist/Cat Type Smoke Setup.exe"
          -LegacyExecutable
          "${{ runner.temp }}/cat-type-v1.0.5/dist/Cat Type.exe"

      - name: Install macOS disk image tooling
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_source="${RUNNER_TEMP}/cat-type-dmg-${{ matrix.package_arch }}"
          mkdir -p "$dmg_source"
          cp -R "dist/Cat Type.app" "$dmg_source/"
          create-dmg \
            --volname "Cat Type" \
            --window-pos 200 120 \
            --window-size 600 360 \
            --background "packaging/dmg-background-v3.png" \
            --volicon "assets/cat-type.icns" \
            --icon-size 120 \
            --icon "Cat Type.app" 132 182 \
            --hide-extension "Cat Type.app" \
            --app-drop-link 468 182 \
            --no-internet-enable \
            --overwrite \
            "dist/Cat-Type-macOS-${{ matrix.package_arch }}.dmg" \
            "$dmg_source"

      - name: Build Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C dist -czf \
            "dist/Cat-Type-Linux-${{ matrix.package_arch }}.tar.gz" \
            "Cat Type"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.source }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum Cat-Type-* > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" ./* --generate-notes
