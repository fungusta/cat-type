name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_macos_app_store:
        description: Upload the signed macOS package to App Store Connect
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: Cat-Type-Windows-x64.exe
            source: dist/Cat-Type-Windows-x64.exe
            executable: dist/Cat Type.exe
            package_arch: x64
          - runner: ubuntu-22.04
            asset: Cat-Type-Linux-x64.tar.gz
            source: dist/Cat-Type-Linux-x64.tar.gz
            executable: dist/Cat Type
            package_arch: x64
          - runner: ubuntu-22.04-arm
            asset: Cat-Type-Linux-arm64.tar.gz
            source: dist/Cat-Type-Linux-arm64.tar.gz
            executable: dist/Cat Type
            package_arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_version.py "${{ github.ref_name }}"

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk libayatana-appindicator3-1 xauth xvfb

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Run automated tests
        if: runner.os != 'Linux'
        run: >-
          python -m unittest
          tests.test_macos_overlay_focus
          tests.test_macos_pointer
          tests.test_behavior
          tests.test_settings
          tests.test_usage_metrics
          tests.test_settings_window
          tests.test_platform_assets
          tests.test_bundled_icon_check
          tests.test_package_smoke
          tests.test_release_version_check
          tests.test_auto_update
          tests.test_update_controller
          tests.test_platform_updater
          tests.test_windows_installer_contract
          -v

      - name: Run automated tests with a virtual display
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          python -m unittest
          tests.test_macos_overlay_focus
          tests.test_macos_pointer
          tests.test_behavior
          tests.test_settings
          tests.test_usage_metrics
          tests.test_settings_window
          tests.test_platform_assets
          tests.test_bundled_icon_check
          tests.test_package_smoke
          tests.test_release_version_check
          tests.test_auto_update
          tests.test_update_controller
          tests.test_platform_updater
          tests.test_windows_installer_contract
          tests.test_linux_update_integration
          -v

      - name: Build application
        run: |
          python scripts/build_icon.py
          python -m PyInstaller --noconfirm --clean CatType.spec

      - name: Verify bundled runtime assets
        run: python -m scripts.check_bundled_icon "${{ matrix.executable }}"

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          python -m scripts.smoke_linux_package
          "${{ matrix.executable }}"

      - name: Smoke test frozen Linux update
        if: runner.os == 'Linux'
        run: >-
          python -m scripts.smoke_linux_update
          "${{ matrix.executable }}"

      - name: Smoke test Windows shutdown handoff
        if: runner.os == 'Windows'
        run: >-
          python -m scripts.smoke_windows_package
          "${{ matrix.executable }}"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\CatType.iss
          Move-Item -LiteralPath "dist\Cat Type Setup.exe" -Destination "dist\Cat-Type-Windows-x64.exe"

      - name: Build isolated Windows installer smoke fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $legacyRoot = Join-Path $env:RUNNER_TEMP "cat-type-v1.0.5"
          git worktree add --detach $legacyRoot b0ce667
          Push-Location $legacyRoot
          try {
            python -m PyInstaller --noconfirm --clean CatType.spec
          }
          finally {
            Pop-Location
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppId={{15AA574B-A234-42C7-8328-607B2D83000F}" `
            "/DMyOutputBaseFilename=Cat Type Smoke Setup" `
            "/DMyUninstallable=no" `
            "/DSmokeTest=1" `
            packaging\CatType.iss

      - name: Smoke test Windows legacy installer update
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/smoke_windows_installer_update.ps1
          -Installer "dist/Cat Type Smoke Setup.exe"
          -LegacyExecutable
          "${{ runner.temp }}/cat-type-v1.0.5/dist/Cat Type.exe"

      - name: Build Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C dist -czf \
            "dist/Cat-Type-Linux-${{ matrix.package_arch }}.tar.gz" \
            "Cat Type"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.source }}
          if-no-files-found: error

  macos-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Test the canonical macOS App Store experience
        run: >-
          python -m unittest
          tests.test_macos_overlay_focus
          tests.test_macos_pointer
          tests.test_behavior
          tests.test_settings
          tests.test_usage_metrics
          tests.test_settings_window
          tests.test_platform_assets
          tests.test_bundled_icon_check
          tests.test_package_smoke
          tests.test_release_version_check
          tests.test_auto_update
          tests.test_update_controller
          tests.test_platform_updater
          tests.test_windows_installer_contract
          -v

      - name: Build the canonical macOS package layout
        env:
          CAT_TYPE_BUILD_NUMBER: "1"
        run: |
          python scripts/build_icon.py
          python -m PyInstaller --noconfirm --clean CatType.spec

      - name: Verify bundled macOS runtime assets
        run: >-
          python -m scripts.check_bundled_icon
          "dist/Cat Type.app/Contents/MacOS/Cat Type"

  macos-app-store:
    name: Build and optionally upload the Mac App Store package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: macos-tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPMENT_TEAM: 9B98U2J5Q2
      BUNDLE_ID: com.fungusta.cat-type
      ASC_APP_ID: "6806567925"
      CAT_TYPE_PYTHON: python

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Mac App Store signing credentials
        env:
          CAT_TYPE_MAC_APP_CERTIFICATE_P12_B64: ${{ secrets.CAT_TYPE_MAC_APP_CERTIFICATE_P12_B64 }}
          CAT_TYPE_MAC_APP_CERTIFICATE_PASSWORD: ${{ secrets.CAT_TYPE_MAC_APP_CERTIFICATE_PASSWORD }}
          CAT_TYPE_MAC_INSTALLER_CERTIFICATE_P12_B64: ${{ secrets.CAT_TYPE_MAC_INSTALLER_CERTIFICATE_P12_B64 }}
          CAT_TYPE_MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.CAT_TYPE_MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          CAT_TYPE_MAC_APP_STORE_PROFILE_B64: ${{ secrets.CAT_TYPE_MAC_APP_STORE_PROFILE_B64 }}
        run: ./scripts/macos-app-store-credentials.sh install

      - name: Build signed Mac App Store package
        env:
          CAT_TYPE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: ./scripts/build_macos_app_store.sh

      - name: Verify package payload
        run: |
          package_path="dist/Cat-Type-macOS-App-Store.pkg"
          pkgutil --check-signature "$package_path"
          pkgutil --payload-files "$package_path" | grep -Fq "Cat Type.app/Contents/MacOS/Cat Type"

      - name: Prepare App Store Connect API key
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_macos_app_store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY_B64" ]; then
            echo "::error::Missing ASC_KEY_ID, ASC_ISSUER_ID, or ASC_PRIVATE_KEY_B64 repository secrets."
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"
          openssl pkey -in "$key_path" -check -noout
          echo "ASC_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Validate package with App Store Connect
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_macos_app_store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcrun altool --validate-app
          -f "dist/Cat-Type-macOS-App-Store.pkg"
          -t macos
          --apiKey "$ASC_KEY_ID"
          --apiIssuer "$ASC_ISSUER_ID"
          --p8-file-path "$ASC_PRIVATE_KEY_PATH"

      - name: Upload package to App Store Connect
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_macos_app_store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcrun altool --upload-app
          -f "dist/Cat-Type-macOS-App-Store.pkg"
          -t macos
          --apiKey "$ASC_KEY_ID"
          --apiIssuer "$ASC_ISSUER_ID"
          --p8-file-path "$ASC_PRIVATE_KEY_PATH"

      - name: Upload signed package artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-app-store-pkg-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/Cat-Type-macOS-App-Store.pkg
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary credentials
        if: always()
        run: |
          ./scripts/macos-app-store-credentials.sh cleanup
          if [ -n "${ASC_PRIVATE_KEY_PATH:-}" ]; then
            rm -f -- "$ASC_PRIVATE_KEY_PATH"
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-tests, macos-app-store]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: Cat-Type-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum Cat-Type-* > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" ./* --generate-notes
