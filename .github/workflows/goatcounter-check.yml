name: GoatCounter check

# Run by hand to see what GoatCounter's API returns for the download report's
# queries, using the same secret. See docs/download-report.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Query GoatCounter
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python -m scripts.goatcounter_check
