name: Cross-platform build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: cat-type-windows-x64
            output: dist/Cat Type.exe
            executable: dist/Cat Type.exe
          - runner: macos-15-intel
            artifact: cat-type-macos-x64
            output: dist/Cat Type.app
            executable: dist/Cat Type.app/Contents/MacOS/Cat Type
          - runner: ubuntu-22.04
            artifact: cat-type-linux-x64
            output: dist/Cat Type
            executable: dist/Cat Type

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk libayatana-appindicator3-1 xauth xvfb

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Run automated tests
        if: runner.os != 'Linux'
        run: >-
          python -m unittest
          tests.test_behavior
          tests.test_settings
          tests.test_settings_window
          tests.test_platform_assets
          tests.test_bundled_icon_check
          tests.test_package_smoke
          tests.test_release_version_check
          tests.test_auto_update
          tests.test_update_controller
          tests.test_windows_installer_contract
          -v

      - name: Run automated tests with a virtual display
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          python -m unittest
          tests.test_behavior
          tests.test_settings
          tests.test_settings_window
          tests.test_platform_assets
          tests.test_bundled_icon_check
          tests.test_package_smoke
          tests.test_release_version_check
          tests.test_auto_update
          tests.test_update_controller
          tests.test_platform_updater
          tests.test_windows_installer_contract
          tests.test_linux_update_integration
          -v

      - name: Build application
        run: |
          python scripts/build_icon.py
          python -m PyInstaller --noconfirm --clean CatType.spec

      - name: Verify bundled runtime assets
        run: python -m scripts.check_bundled_icon "${{ matrix.executable }}"

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum
          python -m scripts.smoke_linux_package
          "${{ matrix.executable }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
